# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=0
blur_layer=1
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 12
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color = 0x000000ff

border_radius = 5
# no_radius_when_single: drop the rounded corners when the monitor shows only
# one tiled window. That is exactly the monocle fullscreen case (SUPER+f),
# where the single window covers the whole screen and rounded corners would
# show the wallpaper in its corners.
# It also applies to any other tag that happens to hold a single window -
# set it to 0 if you want rounded corners there.
no_radius_when_single = 1
focused_opacity = 1.0
unfocused_opacity = 1.0

dim_enable = 0
dim_focused_color = 0x00000000
dim_unfocused_color = 0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations = 1
layer_animations = 1
animation_type_open = zoom
animation_type_close = zoom
layer_animation_type_open = slide
layer_animation_type_close = slide
animation_fade_in = 1
animation_fade_out = 1
tag_animation_direction = 1
zoom_initial_ratio = 0.5
zoom_end_ratio = 0
fade_in_begin_opacity = 0.8
fade_out_begin_opacity = 0.8
animation_duration_move = 300
animation_duration_open = 300
animation_duration_tag = 300
animation_duration_close = 300
animation_duration_focus = 0
animation_curve_open = 0.46,1.0,0.29,1
animation_curve_move = 0.46,1.0,0.29,1
animation_curve_tag = 0.46,1.0,0.29,1
animation_curve_close = 0.08,0.92,0,1
animation_curve_focus = 0.46,1.0,0.29,1
animation_curve_opacity_fade_out = 0.58,0.98,0.58,5
animation_curve_opacity_fade_in = 0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs = 3
scroller_default_proportion = 0.4
scroller_focus_center = 0
scroller_prefer_center = 1
edge_scroller_pointer_focus = 1
edge_scroller_focus_allow_speed = 0.0
scroller_ignore_proportion_single = 1
scroller_default_proportion_single = 1.0
scroller_proportion_preset = 0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master = 1
default_master_factor = 0.55
default_master_count = 1
tag_num = 9
smart_gaps = 0

# monocle / groups
group_bar_height = 20
group_bar_decorate_border_width = 1
group_bar_decorate_font_desc = Inter Bold 10
group_bar_decorate_fg_color = 0xbfbebeff
group_bar_decorate_bg_color = 0x201b14ff
group_bar_decorate_focus_fg_color = 0x201b14ff
group_bar_decorate_focus_bg_color = 0x95C381ff
group_bar_decorate_border_color = 0x212121ff
group_bar_decorate_corner_radius = 0
group_bar_decorate_padding_x = 4
group_bar_decorate_padding_y = 0

# Monocle Tabbed Mode
# Merges every window stacked in a monocle tag into a single tab strip.
# Only active while the tag layout is monocle; reach it with SUPER+n, which
# cycles circle_layout (tile -> scroller -> monocle).
# Move between tabs with focusstack: SUPER,j / SUPER,k.
# Toggle at runtime (no reload needed):
#   ALT+SHIFT,m -> setoption,monocle_tab_mode,1
#   ALT+SHIFT,n -> setoption,monocle_tab_mode,0
# The strip sits above the group bar when both apply.
monocle_tab_mode = 0
tab_bar_height = 30
tab_bar_decorate_font_desc = Inter Medium 10
tab_bar_decorate_fg_color = 0xbfbebeff
tab_bar_decorate_bg_color = 0x201b14ff
tab_bar_decorate_focus_fg_color = 0xfbf1c7ff
tab_bar_decorate_focus_bg_color = 0x151515ff
tab_bar_decorate_border_color = 0x212121ff
tab_bar_decorate_border_width = 0
tab_bar_decorate_corner_radius = 5
tab_bar_decorate_padding_x = 0
tab_bar_decorate_padding_y = 0

# Monocle Layout Setting
# Both options apply while the tag's layout is monocle.
# monocle_no_gap   : drop the outer gaps so the window fills the whole screen
# monocle_no_border: drop the window border (same idea as the dwm
#                    nobordermonocle patch)
# Together they give the "monocle fullscreen" look that SUPER+f enables.
monocle_no_gap = 1
monocle_no_border = 1

# Dwindle Layout Setting
dwindle_smart_split = 0
dwindle_drop_simple_split = 1
dwindle_manual_split = 0
dwindle_horizontal_split = 1
dwindle_vertical_split = 1
dwindle_preserve_split = 1

# Overview Setting
hotarea_size = 4
enable_hotarea = 0
hotarea_disable_on_fullscreen = 1
overview_gap_inner = 5
overview_gap_outer = 30
overcircle_center_ratio = 0.5

# Misc
xwayland_persistence = 1
tag_carousel = 0
sync_obj_enable = 0
single_scratchpad = 1
no_border_when_single = 0
axis_bind_apply_timeout = 100
focus_on_activate = 1
idle_inhibit_ignore_visible = 0
idle_inhibit_when_fullscreen = 0
sloppy_focus = 0
warp_cursor = 1
focus_cross_monitor = 0
focus_direction_only_zone_overlap = 1
focus_cross_tag = 0
circle_layout = tile,scroller,monocle
enable_floating_snap = 1
snap_distance = 50
float_full_to_top = 0
cursor_size = 22
#cursor_theme = Bibata-Modern-Ice
cursor_theme = Simp1e
cursor_hide_timeout = 3
drag_tile_to_tile = 1
drag_tile_small = 1

# keyboard
repeat_rate = 30
repeat_delay = 250
numlock_on = 1
xkb_rules_layout = us,ru
xkb_rules_options = caps:escape

# Trackpad
# need relogin to make it apply
disable_trackpad = 0
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
trackpad_natural_scrolling = 1
trackpad_disable_while_typing = 1
trackpad_left_handed = 0
trackpad_middle_button_emulation = 0
swipe_min_threshold = 1

# mouse
# need relogin to make it apply
mouse_natural_scrolling = 0
mouse_accel_profile = 2
mouse_accel_speed = 0.0

# Appearance
gap_inner_horizontal = 3
gap_inner_vertical = 3
gap_outer_horizontal = 3
gap_outer_vertical = 3
scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.9
border_px = 1
root_color = 0x201b14ff
border_color = 0x212121ff
focus_color = 0x404040ff
# focus_color = 0xc9b890ff
drop_color = 0x8FBA7C55
split_color = 0xEB441EFF
maximized_screen_color = 0xBABD2Cff
urgent_color = 0xad401fff
scratchpad_color = 0xc4939dff
global_color = 0x8d64cfff
overlay_color = 0x95C381ff

# sub config load
source = ./env.conf
source = ./bind.conf
source = ./rule.conf
source = ./monitor.conf
source = ./tag.conf

# run autostart
exec_once = ~/.config/mango/autostart.sh
