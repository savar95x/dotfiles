<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <match target="font">
        <test name="family" compare="contains">
            <string>Material Symbols</string>
        </test>
        <!-- Force the FILL variable axis to 1 (Filled) -->
        <edit name="fontvariations" mode="assign">
            <string>FILL=1</string>
        </edit>
    </match>
</fontconfig>
